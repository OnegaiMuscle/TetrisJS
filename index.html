<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tetris Hexagonal Ultra Arcade</title>
  <title>Othello</title>
  <link rel="canonical" href="https://onegaimuscle.github.io/TetrisJS/">
  <link rel="stylesheet" href="./style.css">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
</head>
<body>
    <div class="game-container">
        <canvas id="game"></canvas>
        <div class="side-panel">
            <div class="stats">
                <div>Score<br><span id="score">0</span></div>
                <hr style="border:0;border-top:1px solid #0ef">
                <div>Best<br><span id="best">0</span></div>
            </div>
            <div class="stats" style="text-align: center;">
                <div>Next</div>
                <canvas id="next"></canvas>
            </div>
            <div class="stats">
                <div>Combo<br><span id="combo-ui">0</span></div>
            </div>
            <div class="instructions">
                TAP: Rot/Move<br>SWIPE ↑: Rot<br>SWIPE ↓: Drop
            </div>
        </div>
    </div>

<script type="module" src="./tetris.js"></script>
</body>
</html>
